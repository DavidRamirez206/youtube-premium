name: Bug report
description: Something provided by YouTube Premium does not work, or it behaves differently from the stock YouTube TV app.
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the [existing issues](https://github.com/DavidRamirez206/youtube-premium/issues) first.

        This form is for problems with YouTube Premium features (ad blocking, SponsorBlock, the settings menu, remote keys...) or behaviour that differs from the stock YouTube TV app. For changes to YouTube's own behaviour, use the feature request form.

        **Never paste certificates, passwords, cookies or account tokens.**
  - type: input
    id: version
    attributes:
      label: YouTube Premium version
      description: Shown at the top of the settings menu (green button).
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Samsung (Tizen)
        - LG (webOS)
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: Tizen / webOS version
      description: 'Samsung: Settings > Support > About This TV. LG: Settings > General > About This TV.'
      placeholder: e.g. Tizen 10.0, webOS 6.3.2
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: TV model
      placeholder: e.g. UN43M70HAKXZL, 50UP7670PUC
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead. Screenshots or photos help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a video
        2. Press the green button
        3. ...
    validations:
      required: true
  - type: dropdown
    id: menu
    attributes:
      label: Does the settings menu open with the green button?
      options:
        - 'Yes'
        - 'No'
        - Not tested
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Console output from the debugger or the on-screen debug console, if you have it.
      render: text
