name: Feature request
description: Suggest a new feature or a change to how YouTube Premium or YouTube TV behaves.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Please search the [existing issues](https://github.com/DavidRamirez206/youtube-premium/issues) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Mention the remote key or menu option you have in mind, if any.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Samsung (Tizen)
        - LG (webOS)
