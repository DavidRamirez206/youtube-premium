name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign build provenance
      attestations: write # store build provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need the history and tags
          persist-credentials: false

      - uses: ./.github/actions/setup-env

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Lint, test and build
        run: |
          pnpm lint:all
          pnpm test
          pnpm build:tizen
          pnpm test:compat

      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm package:tizen "ClearTubeTV_${version}_tizen_unsigned.wgt"
          pnpm package:webos
          mv youtube.leanback.v4_*_all.ipk "ClearTubeTV_${version}_webos.ipk"
          sha256sum *.wgt *.ipk > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.wgt
            *.ipk

      - name: Write release notes
        run: node tools/release-notes.js "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "ClearTube TV ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag ${prerelease} \
            *.wgt *.ipk SHA256SUMS
