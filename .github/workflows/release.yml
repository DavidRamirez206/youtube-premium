name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Run by hand (Actions > Release > Run workflow) to tag the selected commit
  # with the version in package.json and publish its release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign build provenance
      attestations: write # store build provenance

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release notes need the history and tags
          persist-credentials: false

      - uses: ./.github/actions/setup-env

      - name: Choose the release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "::error::Tag ${tag} already exists; raise the version in package.json first"
              exit 1
            fi
            # Local tag so the release notes can find the previous one.
            git tag "${tag}"
            echo "NEW_TAG=1" >> "${GITHUB_ENV}"
          else
            tag="${GITHUB_REF_NAME}"
            if [ "v${version}" != "${tag}" ]; then
              echo "::error::Tag ${tag} does not match package.json version ${version}"
              exit 1
            fi
          fi
          echo "TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Lint, test and build
        run: |
          pnpm lint:all
          pnpm test
          pnpm build:tizen
          pnpm test:compat

      - name: Package
        run: |
          version="$(node -p "require('./package.json').version")"
          pnpm package:tizen "YouTubePremium_${version}_tizen_unsigned.wgt"
          pnpm package:webos
          mv youtube.leanback.v4_*_all.ipk "YouTubePremium_${version}_webos.ipk"
          sha256sum *.wgt *.ipk > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.wgt
            *.ipk

      - name: Write release notes
        run: node tools/release-notes.js "${TAG}" > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
          # A manual run creates the tag on the built commit; a pushed tag
          # must already exist.
          if [ -n "${NEW_TAG:-}" ]; then
            tagging=(--target "${GITHUB_SHA}")
          else
            tagging=(--verify-tag)
          fi
          gh release create "${TAG}" \
            --title "YouTube Premium ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${tagging[@]}" ${prerelease} \
            *.wgt *.ipk SHA256SUMS
